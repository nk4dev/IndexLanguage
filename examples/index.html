<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <title>hello-wasm example</title>
    <style>
      body {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        margin: 2rem;
        background: #1e1e1e;
        color: #d4d4d4;
      }
      h1 { font-size: 1rem; color: #9cdcfe; }
      #controls {
        display: flex;
        gap: 0.5rem;
        margin-bottom: 1rem;
      }
      #args {
        flex: 1;
        font: inherit;
        padding: 0.4rem 0.6rem;
        background: #000;
        color: #d4d4d4;
        border: 1px solid #333;
        border-radius: 6px;
      }
      #run {
        font: inherit;
        padding: 0.4rem 1rem;
        background: #0e639c;
        color: #fff;
        border: 0;
        border-radius: 6px;
        cursor: pointer;
      }
      #run:hover { background: #1177bb; }
      #run:disabled { background: #333; cursor: not-allowed; }
      #console {
        white-space: pre-wrap;
        word-break: break-word;
        background: #000;
        border: 1px solid #333;
        border-radius: 6px;
        padding: 1rem;
        min-height: 8rem;
      }
      #console .log { color: #d4d4d4; }
      #console .warn { color: #dcdcaa; }
      #console .error { color: #f48771; }
    </style>
  </head>
  <body>
    <h1>index lang — console output</h1>
    <div id="controls">
      <input id="args" type="text" value="--help" placeholder="argument (e.g. --help, --version)" />
      <button id="run" disabled>Run</button>
    </div>
    <div id="console"></div>
    <script type="module" src="./browser.js"></script>
  </body>
</html>
